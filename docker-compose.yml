services:
  telebot:
    build: .
    container_name: telebot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-7777}:${PORT:-7777}"
    volumes:
      # Persist chat IDs and forwarding routes across rebuilds
      - ./output.txt:/app/output.txt
      - ./finput.txt:/app/finput.txt
      - ./foutput.txt:/app/foutput.txt
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-7777}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
